name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_PUBLIC_API_BASE: https://example.com
      EXPO_PUBLIC_STORE_WHATSAPP: "6280000000000"
      EXPO_PUBLIC_FIREBASE_API_KEY: ci_placeholder_key
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Check Markdown links
        run: npm run check:links
      - name: Check public repository
        run: npm run check:sensitive
      - name: Export Android bundle
        run: npm run build
